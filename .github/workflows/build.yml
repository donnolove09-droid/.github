name: Build ASNLIGHT UI dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install ldid dpkg

      - name: Install Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          if [ ! -d "$HOME/theos/sdks/iPhoneOS.sdk" ]; then
            rm -rf "$HOME/theos/sdks"
            git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          test -x "$HOME/theos/bin/nic.pl"
          test -d "$HOME/theos/sdks"
          make --version
          xcodebuild -version

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASNLIGHT-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: error
